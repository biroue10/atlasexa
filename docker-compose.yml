services:
  database:
    image: postgres:17-alpine
    container_name: atlasexa-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlasexa_db}
      POSTGRES_USER: ${POSTGRES_USER:-atlasexa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - atlasexa_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-atlasexa_user} -d ${POSTGRES_DB:-atlasexa_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - atlasexa

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlasexa-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atlasexa_user}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-atlasexa_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://127.0.0.1:8000/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atlasexa

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: atlasexa-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - atlasexa

volumes:
  atlasexa_postgres_data:

networks:
  atlasexa:
    driver: bridge
