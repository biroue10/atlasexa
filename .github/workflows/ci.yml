name: Atlasexa CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: atlasexa_test_db
          POSTGRES_USER: atlasexa_user
          POSTGRES_PASSWORD: atlasexa_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U atlasexa_user -d atlasexa_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable pg_trgm
        env:
          PGPASSWORD: atlasexa_test_password
        run: |
          psql \
            -h 127.0.0.1 \
            -U atlasexa_user \
            -d atlasexa_test_db \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA public;"

      - name: Create backend test environment
        working-directory: backend
        run: |
          cat > .env.test <<'ENV'
          DATABASE_URL=postgresql+psycopg://atlasexa_user:atlasexa_test_password@127.0.0.1:5432/atlasexa_test_db
          CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
          ENV

      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://atlasexa_user:atlasexa_test_password@127.0.0.1:5432/atlasexa_test_db
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

      - name: Compile Python files
        working-directory: backend
        run: python -m compileall app tests scripts

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Validate performance budget
        working-directory: frontend
        run: npm run validate:performance
